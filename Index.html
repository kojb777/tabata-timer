<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><title>Tabata Timer</title>
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#f8fafc;background:#0b1220}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:18px}.app{width:min(100%,460px);background:#172235;border:1px solid #304057;border-radius:28px;padding:26px;box-shadow:0 20px 70px #0005}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:21px;letter-spacing:.09em;margin:0}.tag{font-size:12px;color:#a6b8ce} .dial{margin:24px auto 18px;width:min(75vw,290px);aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--accent,#4ade80) var(--progress,0%),#344257 0);padding:12px;transition:background .15s}.inside{height:100%;border-radius:50%;background:#172235;display:flex;flex-direction:column;align-items:center;justify-content:center}.phase{font-weight:800;letter-spacing:.12em;color:var(--accent,#4ade80)}.time{font-size:clamp(66px,17vw,90px);font-weight:750;font-variant-numeric:tabular-nums;line-height:1.3}.round{color:#cbd5e1}.status{text-align:center;min-height:24px;color:#b8c9df;margin-bottom:16px}.controls{display:flex;gap:10px}.controls button{flex:1}button{border:0;border-radius:14px;padding:15px 12px;font-size:16px;font-weight:750;cursor:pointer;background:#334155;color:white}button.primary{background:#4ade80;color:#102017}button:disabled{opacity:.4;cursor:not-allowed}.settings{margin-top:26px;border-top:1px solid #344257;padding-top:18px}.settings h2{font-size:16px;margin:0 0 12px}.setting{display:flex;justify-content:space-between;align-items:center;margin:12px 0;gap:12px}.stepper{display:flex;align-items:center;gap:12px}.stepper button{padding:7px 12px;font-size:20px;min-width:38px}.value{min-width:50px;text-align:center;font-variant-numeric:tabular-nums}.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px;color:#b8c9df;font-size:13px}.footer label{display:flex;align-items:center;gap:6px}input{accent-color:#4ade80}button:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:3px}@media(max-width:360px){.app{padding:18px}.controls{flex-wrap:wrap}}
 .voice-status{text-align:center;font-size:12px;color:#a6b8ce;margin:12px 0 0;line-height:1.5}</style></head><body><main class="app"><header><h1>TABATA TIMER</h1><span class="tag">INTERVAL TRAINING</span></header><div class="dial" id="dial"><div class="inside"><div class="phase" id="phase">READY</div><div class="time" id="time">20</div><div class="round" id="round">ROUND 1 / 8</div></div></div><div class="status" id="status" aria-live="polite">スタートを押して開始</div><div class="controls"><button class="primary" id="start">▶ 開始</button><button id="reset">↺ リセット</button></div><section class="settings"><h2>タイマー設定</h2><div class="setting"><span>運動時間</span><div class="stepper"><button data-key="work" data-delta="-5" aria-label="運動時間を減らす">−</button><span class="value" id="workValue">20秒</span><button data-key="work" data-delta="5" aria-label="運動時間を増やす">＋</button></div></div><div class="setting"><span>休憩時間</span><div class="stepper"><button data-key="rest" data-delta="-5" aria-label="休憩時間を減らす">−</button><span class="value" id="restValue">10秒</span><button data-key="rest" data-delta="5" aria-label="休憩時間を増やす">＋</button></div></div><div class="setting"><span>ラウンド数 / セット</span><div class="stepper"><button data-key="rounds" data-delta="-1" aria-label="ラウンド数を減らす">−</button><span class="value" id="roundsValue">8</span><button data-key="rounds" data-delta="1" aria-label="セット数を増やす">＋</button></div></div><div class="setting"><span>セット間リカバリー</span><div class="stepper"><button data-key="recovery" data-delta="-5" aria-label="リカバリー時間を減らす">−</button><span class="value" id="recoveryValue">30秒</span><button data-key="recovery" data-delta="5" aria-label="リカバリー時間を増やす">＋</button></div></div><div class="setting"><span>セット数</span><div class="stepper"><button data-key="sets" data-delta="-1" aria-label="セット数を減らす">−</button><span class="value" id="setsValue">3</span><button data-key="sets" data-delta="1" aria-label="セット数を増やす">＋</button></div></div></section><div class="footer"><label><input id="voice" type="checkbox" checked> 英語音声</label><span id="total">合計 4分00秒</span><label><input id="sound" type="checkbox" checked> 通知音</label></div><p id="voiceStatus" class="voice-status" role="status">English voice · fast (1.3×) · female preferred</p></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const defaults={work:20,rest:10,rounds:8,recovery:30,sets:3}, limits={work:[5,300],rest:[5,300],rounds:[1,50],recovery:[0,600],sets:[1,20]};
let cfg={...defaults};
try{const saved=JSON.parse(localStorage.getItem('tabata-settings'));if(saved&&typeof saved==='object'){for(const k of Object.keys(defaults)){if(Number.isInteger(saved[k])&&saved[k]>=limits[k][0]&&saved[k]<=limits[k][1])cfg[k]=saved[k]}}}catch{}
let phase='ready',round=1,setNumber=1,remaining=cfg.work,running=false,deadline=0,tickId=null,audio=null,lastCount=null;
const synth=('speechSynthesis' in window)?window.speechSynthesis:null;
let chosenVoice=null;
try{const opts=JSON.parse(localStorage.getItem('tabata-options'));if(opts&&typeof opts==='object'){if(typeof opts.voice==='boolean')$('voice').checked=opts.voice;if(typeof opts.sound==='boolean')$('sound').checked=opts.sound}}catch{}
function saveOptions(){try{localStorage.setItem('tabata-options',JSON.stringify({voice:$('voice').checked,sound:$('sound').checked}))}catch{}}
function chooseVoice(){if(!synth)return;const en=synth.getVoices().filter(v=>/^en([-_]|$)/i.test(v.lang));const female=/samantha|victoria|karen|moira|tessa|ava|allison|susan|zira|aria|jenny|female|serena|kate|fiona|siri/i;chosenVoice=en.find(v=>female.test(v.name))||en.find(v=>/^en-US/i.test(v.lang))||en[0]||null;$('voiceStatus').textContent=chosenVoice?`English voice: ${chosenVoice.name} · fast (1.3×) · female preferred`:'English voice: device default · fast (1.3×) · female preferred';}
if(synth){chooseVoice();synth.addEventListener?.('voiceschanged',chooseVoice)}else $('voiceStatus').textContent='This browser does not support speech synthesis; beeps remain available.';
function audioInit(){try{if(navigator.audioSession)navigator.audioSession.type='playback';audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume().catch(()=>{});const buffer=audio.createBuffer(1,1,audio.sampleRate),source=audio.createBufferSource();source.buffer=buffer;source.connect(audio.destination);source.start()}catch{}}
function beep(freq=880,duration=.12){if(!$('sound').checked)return;try{if(!audio)return;const osc=audio.createOscillator(),gain=audio.createGain(),t=audio.currentTime;osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.14,t+.015);gain.gain.exponentialRampToValueAtTime(.0001,t+duration);osc.connect(gain).connect(audio.destination);osc.start(t);osc.stop(t+duration+.02)}catch{}}
function finishSound(){beep(660,.16);setTimeout(()=>beep(880,.16),180);setTimeout(()=>beep(1100,.3),360)}
function speak(message){if(!$('voice').checked||!synth)return;try{if(synth.paused)synth.resume();synth.cancel();const u=new SpeechSynthesisUtterance(message);u.lang=chosenVoice?.lang||'en-US';if(chosenVoice)u.voice=chosenVoice;u.rate=1.3;u.pitch=1.08;u.volume=1;u.onerror=()=>{$('voiceStatus').textContent='音声が再生できません。iPhoneの音量・消音設定を確認してください。'};synth.speak(u)}catch{}}
function duration(){return phase==='prep'?3:phase==='rest'?cfg.rest:phase==='recovery'?cfg.recovery:cfg.work}
function render(){const active=['work','rest','recovery','prep'].includes(phase);const accent=phase==='rest'?'#fbbf24':phase==='recovery'?'#38bdf8':phase==='prep'?'#a78bfa':phase==='done'?'#60a5fa':'#4ade80';$('dial').style.setProperty('--accent',accent);$('dial').style.setProperty('--progress',`${active?100*(1-remaining/Math.max(1,duration())):phase==='done'?100:0}%`);$('phase').textContent=phase==='work'?'WORK / 運動':phase==='rest'?'REST / 休憩':phase==='recovery'?'RECOVERY / セット間回復':phase==='done'?'FINISHED':phase==='prep'?'GET READY':'READY';$('time').textContent=String(Math.ceil(Math.max(0,remaining))).padStart(2,'0');$('round').textContent=`SET ${setNumber} / ${cfg.sets} · ROUND ${round} / ${cfg.rounds}`;$('status').textContent=phase==='done'?'トレーニング完了！':phase==='ready'?'スタートを押して開始':phase==='prep'?'開始までのカウントダウン':running?'トレーニング中':'一時停止中';$('start').textContent=running?'Ⅱ 一時停止':phase==='ready'||phase==='done'?'▶ 開始':'▶ 再開';for(const k of Object.keys(cfg))$(k+'Value').textContent=cfg[k]+(['rounds','sets'].includes(k)?'':'秒');const total=cfg.sets*(cfg.work*cfg.rounds+cfg.rest*(cfg.rounds-1))+cfg.recovery*(cfg.sets-1);$('total').textContent=`合計 ${Math.floor(total/60)}分${String(total%60).padStart(2,'0')}秒`;document.querySelectorAll('[data-key]').forEach(b=>b.disabled=phase!=='ready'&&phase!=='done')}
function stop(){running=false;if(tickId!==null){clearInterval(tickId);tickId=null}}
function reset(){stop();synth?.cancel();phase='ready';round=1;setNumber=1;remaining=cfg.work;lastCount=null;render()}
function advance(){lastCount=null;
if(phase==='prep'){phase='work';remaining=cfg.work;beep(1000,.2);speak('Go! Work!');return}
if(phase==='work'){
 if(round<cfg.rounds){phase='rest';remaining=cfg.rest;beep(550,.2);speak('Rest!');return}
 if(setNumber===cfg.sets){phase='done';remaining=0;stop();finishSound();speak('Workout complete! Great job!');return}
 if(cfg.recovery>0){phase='recovery';remaining=cfg.recovery;beep(650,.18);speak('Recovery!');return}
 nextSet();return;
}
if(phase==='rest'){round++;phase='work';remaining=cfg.work;beep(1000,.2);speak(round===cfg.rounds?'Final round! Go!':`Round ${round}. Go!`);return}
if(phase==='recovery'){nextSet()}
}
function nextSet(){setNumber++;round=1;phase='work';remaining=cfg.work;beep(1000,.2);speak(`Set ${setNumber}. Go! Work!`)}

function countdown(){if(!running||!['prep','work','rest','recovery'].includes(phase))return;const n=Math.ceil(remaining);if(n===lastCount)return;lastCount=n;if(n>=1&&n<=3){beep(n===1?1050:780,n===1?.28:.10)}}
function tick(){if(!running)return;let ms=deadline-performance.now();while(ms<=0&&running){advance();if(!running)break;deadline+=remaining*1000;ms=deadline-performance.now()}if(running){remaining=Math.max(0,ms/1000);countdown()}render()}
$('start').addEventListener('click',()=>{audioInit();if(running){remaining=Math.max(0,(deadline-performance.now())/1000);stop();synth?.cancel();render();return}if(phase==='ready'||phase==='done'){if(synth){chooseVoice();if(synth.paused)synth.resume()}phase='prep';round=1;setNumber=1;remaining=3;lastCount=null}else lastCount=null;running=true;deadline=performance.now()+remaining*1000;tickId=setInterval(tick,50);tick()});
$('reset').addEventListener('click',reset);
document.querySelectorAll('[data-key]').forEach(b=>b.addEventListener('click',()=>{if(phase!=='ready'&&phase!=='done')return;const k=b.dataset.key;cfg[k]=Math.max(limits[k][0],Math.min(limits[k][1],cfg[k]+Number(b.dataset.delta)));try{localStorage.setItem('tabata-settings',JSON.stringify(cfg))}catch{}reset()}));
$('voice').addEventListener('change',()=>{saveOptions();if(!$('voice').checked)synth?.cancel();else {audioInit();speak('Voice enabled.')}});
$('sound').addEventListener('change',saveOptions);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});render();
})();
</script></body></html>
